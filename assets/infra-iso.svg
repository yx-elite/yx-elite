<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img" aria-label="Animated isometric infrastructure: users, a load balancer, three app servers, a database and a floating AI agent on a private network, with data packets flowing between them">
<title>Infrastructure</title><style>
  .fade { opacity: 0; animation: fade .8s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .up { opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .flowr { stroke-dasharray: 4 6; animation: flowr 1.2s linear infinite; }
  @keyframes flowr { to { stroke-dashoffset: 20; } }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .blink { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.8); opacity: 0; } }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
  .spinr { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .up { animation: none; opacity: 1; }
    .flow, .flowr, .pulse, .blink, .ring, .bob, .spin, .spinr { animation: none; }
  }</style>
