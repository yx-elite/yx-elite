<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Thanks for stopping by — let's build something in the cloud.">
<title>Thanks for stopping by</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121b3d"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#5b6fa8" fill-opacity=".22"/></pattern>
  <radialGradient id="glowC"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowV"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><clipPath id="fc"><rect width="1000" height="120" rx="16"/></clipPath>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".25" stop-color="#38bdf8"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".75" stop-color="#a78bfa"/><stop offset="1" stop-color="#e0f2fe"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
<style>
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; } .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; }
  .fade { opacity: 0; animation: fade .7s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .up { opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .breathe { animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .draw { stroke-dasharray: 1.02; stroke-dashoffset: 1.02; animation: draw 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .up { animation: none; opacity: 1; }
    .draw { animation: none; stroke-dashoffset: 0; }
    .pulse, .breathe, .blink, .flow, .ring { animation: none; }
  }</style>
<g clip-path="url(#fc)"><rect width="1000" height="120" fill="url(#bg)"/><rect width="1000" height="120" fill="url(#dots)"/>
<circle cx="500" cy="140" r="300" fill="url(#glowV)" class="breathe"/>
<path id="wire" d="M0 92 C 200 72, 300 112, 500 92 S 800 72, 1000 92" fill="none" stroke="#2a3a66" stroke-width="2"/>
<path d="M0 92 C 200 72, 300 112, 500 92 S 800 72, 1000 92" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2" class="flow"/>
<g><circle r="7" fill="#38bdf8" fill-opacity=".25"/><circle r="3" fill="#38bdf8"/><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion></g>
<g><circle r="7" fill="#a78bfa" fill-opacity=".25"/><circle r="3" fill="#a78bfa"/><animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion></g>
<g><circle r="7" fill="#34d399" fill-opacity=".25"/><circle r="3" fill="#34d399"/><animateMotion dur="4.8s" begin="3.2s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion></g>
</g>
<rect x=".5" y=".5" width="999" height="119" rx="15.5" fill="none" stroke="#334155" stroke-opacity=".7"/>
<text x="500" y="52" class="sans fade" font-size="22" font-weight="700" fill="url(#shine)" text-anchor="middle">Thanks for stopping by — let’s build something in the cloud.</text>
</svg>